name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned like the lint gate to the locally-verified set (an unpinned
      # pygments crashed the first deploy against older pymdown-extensions).
      - name: Install mkdocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==11.0.1 pygments==2.19.2
      - name: Build site
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
